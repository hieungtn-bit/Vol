# CI tối thiểu — chặn đúng thứ đã gây ra bug ENAUSDT 11–12/09/2026.
# lifecycle.test.ts là bộ oracle T0–T16 (cả bản điện lẫn /strict); nó đỏ thì không được merge vào production.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      # Chạy riêng và TRƯỚC để log T0–T12 nằm ngay đầu output khi đỏ.
      - name: Vòng đời thẻ — oracle T0–T16
        run: npx vitest run test/lifecycle.test.ts --reporter=verbose

      - name: Toàn bộ test
        run: npx vitest run

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
